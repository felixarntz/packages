packages:
  - 'packages/*'

allowBuilds:
  '@google/genai': false
  esbuild: true
  protobufjs: false
  sharp: true
  unrs-resolver: true

catalog:
  '@commander-js/extra-typings': ^15.0.0
  '@vitest/coverage-v8': ^5.0.0
  commander: ^15.0.0
  dotenv: ^16.6.1
  tsdown: "^0.23.0"
  turbo: ^2.11.10
  typescript: ^7.0.0
  vitest: ^5.0.0

minimumReleaseAge: 2880 # 2 days

minimumReleaseAgeExclude:
  - '@ai-sdk/*'
  - ai
